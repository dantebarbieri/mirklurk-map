# Local smoke test only (http://127.0.0.1:8098). The homeserver runs its own service definition.
services:
  mirklurk-map:
    build:
      context: .
      target: web
    image: mirklurk-map:local
    ports:
      - "127.0.0.1:8098:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      uploads:
        condition: service_healthy
  uploads:
    build:
      context: .
      target: uploads
    environment:
      TRUST_UPLOAD_PROXY: "true"
    volumes:
      - shared-saves:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
volumes:
  shared-saves:
