# Static site for nginxinc/nginx-unprivileged (listens on 8080).
map $uri $cache_control {
  ~^/(app|style)\.[0-9a-f]+\.(js|css)$ "public, max-age=31536000, immutable";
  ~^/assets/game/[a-z0-9_]+\.[0-9a-f]+\.png$ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  # Save files stay in the browser. Game art is loaded from this origin as images.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control $cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
